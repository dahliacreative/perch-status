owner: dahliacreative
repo: perch-status

# What gets checked, every five minutes, from GitHub — nothing here runs on
# Vercel or Railway, so the page still loads when Perch doesn't. Named for the
# family or school reading it, not for the providers.
sites:
  - name: Website
    url: https://learnwithperch.co.uk
  - name: Signing in
    url: https://hq.learnwithperch.co.uk/login
  # Up only when the database answers too (apps/api /health).
  - name: Perch service and database
    url: https://api-live-production-8ebc.up.railway.app/health
  - name: Demo school (playground)
    url: https://learnwithperch.vercel.app/login

status-website:
  # Switch to `cname: status.learnwithperch.co.uk` (and drop baseUrl) only once
  # that DNS record resolves — GitHub Pages stops serving the github.io
  # address as soon as a custom domain is set.
  baseUrl: /perch-status
  logoUrl: https://learnwithperch.co.uk/icon-512.png
  favicon: https://learnwithperch.co.uk/favicon-96.png
  name: Perch status
  introTitle: "Is Perch working?"
  introMessage: Perch checks itself every five minutes from outside its own servers. If something here is red, we already know and we're on it. Questions? Email hello@learnwithperch.co.uk.
  navbar:
    - title: Status
      href: /
    - title: Perch
      href: https://learnwithperch.co.uk
