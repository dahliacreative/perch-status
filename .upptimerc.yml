owner: dahliacreative
repo: perch-status

# What gets checked, every five minutes, from GitHub — nothing here runs on
# Vercel or Railway, so the page still loads when Perch doesn't. Named for the
# family or school reading it, not for the providers.
sites:
  - name: Website
    url: https://learnwithperch.co.uk
  - name: Signing in
    url: https://hq.learnwithperch.co.uk/login
  # Up only when the database answers too (apps/api /health).
  - name: Perch service and database
    url: https://api-live-production-8ebc.up.railway.app/health
  - name: Demo school (playground)
    url: https://learnwithperch.vercel.app/login

status-website:
  # status.learnwithperch.co.uk = a CNAME to dahliacreative.github.io in
  # Vercel's DNS for learnwithperch.co.uk.
  cname: status.learnwithperch.co.uk
  logoUrl: https://learnwithperch.co.uk/icon-512.png
  favicon: https://learnwithperch.co.uk/favicon-96.png
  name: Perch status
  introTitle: "Is Perch working?"
  introMessage: Perch checks itself every five minutes from outside its own servers. If something here is red, we already know and we're on it. Questions? Email hello@learnwithperch.co.uk.
  theme: light
  # Perch's look: cool grey ground, ink text, done green / overdue red, iris
  # links — and no coloured left borders on the cards (they read as AI).
  css: >-
    :root{--body-background-color:#F4F5F9;--body-text-color:#17192B;--card-border-color:#E3E5EE;--nav-border-bottom-color:#E3E5EE;--nav-current-border-bottom-color:#3F38C4;--up-border-left-color:#E3E5EE;--down-border-left-color:#E3E5EE;--degraded-border-left-color:#E3E5EE;--down-background-color:#FDECEC;--tag-up-background-color:#18A059;--tag-down-background-color:#E5484D;--error-button-background-color:#3F38C4;--error-button-border-color:#3F38C4;--submit-button-background-color:#3F38C4;--submit-button-border-color:#3F38C4}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    article{border-radius:14px}
    a{color:#3F38C4}
  navbar:
    - title: Status
      href: /
    - title: Perch
      href: https://learnwithperch.co.uk
